# No `prefix:` line — environment.yml's `prefix: C:\data\envs\des` is a Windows path; conda derives
# a sensible default location from `name: des` on Linux. Pass -p explicitly if a specific path is
# wanted (matching the project's existing convention of managing envs by explicit -p path, not
# -n name — see memory: reference_miniconda_location.md).

# =============================================================================
# Two Linux-specific runtime checks required beyond "pip install succeeded" (plan §5d):
# =============================================================================
#
# 1. Playwright (nav_discovery.py's bearer-token scraping fallback for Morningstar) needs its
#    browser binary AND system libraries installed separately from the pip package:
#      playwright install --with-deps chromium
#    `--with-deps` pulls the apt packages Chromium needs (libnss3, libatk1.0-0, etc.) — a fresh
#    Ubuntu 24.04 install will be missing these. This is a ONE-TIME HOST-PROVISIONING step (root,
#    during initial box setup — see the migration plan §5d "sudo boundary"), not a runtime
#    privilege the pipeline's own unprivileged user needs. Verify with a smoke test before relying
#    on it in production:
#      python -c "from playwright.sync_api import sync_playwright; \
#                  p = sync_playwright().start(); b = p.chromium.launch(headless=True); \
#                  print('OK'); b.close(); p.stop()"
#
# 2. mstarpy (Morningstar client) is pure Python with no compiled extension — low risk, but its
#    HTTP behavior (cookies/headers) has not been verified OS-independent. Run the existing NAV
#    discovery test module once on Linux before relying on it in production
#    (proyecto2/tests/discovery/, excluding test_historia.py which makes a live network call at
#    import time regardless of platform — see the 2026-09-18 CI investigation note in
#    .github/workflows/pg-tests.yml's header comment for why that file is excluded from any
#    current CI wiring).
