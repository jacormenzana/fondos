# Linux-native conda environment spec — companion to environment.yml (Windows), NOT a replacement.
# Reproduce with: conda env create -f environment-linux.yml
#
# Part of the SQLite -> PostgreSQL migration (plan §5d "Linux environment resolution"). Target:
# Ubuntu 24.04 LTS, the Dell OptiPlex 3070 migration host.
#
# Derivation procedure (per the plan, applied here — not improvised fresh):
#   1. Start from environment.yml's conda + pip lists (conda env export --from-history equivalent
#      — this repo's environment.yml is already a hand-curated top-level list, not a full
#      transitive-dependency dump, so no `--from-history` re-derivation was needed).
#   2. Drop the 4 Windows-build-specific conda packages: ucrt, vc, vc14_runtime, vs2015_runtime.
#      These are MSVC runtime libraries with no Linux equivalent — Linux gets its C runtime from
#      glibc via the OS / conda's own linux-64 build chain, not from a conda package. Every other
#      conda-level package (bzip2, ca-certificates, libexpat, libffi, libmpdec, libzlib, openssl,
#      sqlite, tk, xz, zlib, plus pip/python/python_abi/setuptools/wheel) is a normal cross-platform
#      conda package, unchanged.
#   3. Relax to major.minor-only pins for the packages where NUMERICAL reproducibility matters to
#      P2/P3 output (numpy, pandas, scipy, statsmodels) — exact patch versions in environment.yml
#      were encoding a Windows build string as much as an intentional version choice; a linux-64
#      solve should be free to pick the best compatible patch release within that minor version.
#      Every other pip package keeps its exact pin from environment.yml — these are pure-Python or
#      widely-published-manylinux-wheel packages where the exact version is a real, intentional
#      choice, not a platform artifact.
#   4. psycopg2-binary AND psycopg[-binary] both carry over unchanged — psycopg2 still serves the
#      legacy shared/load_fondos_to_postgres.py BI mirror (§P4_BI_CHARTER.md §0), psycopg3 is the
#      migration's own target driver (scripts/mig/pg_seed.py, pg_reconcile.py; shared/testing/pg_fixtures.py).
#
# NOT YET DONE (this file is a reviewed derivation, not a proven one — same honest limitation as
# every other artifact in this migration that needed a Linux host or a live server to fully verify):
#   - Never `conda env create`'d on an actual Linux box from this session (Windows dev environment).
#   - Two dependencies need a Linux-specific runtime check beyond "does pip install succeed" —
#     see the two `playwright`/`mstarpy` notes at the bottom of this file.
#   - ACCEPTANCE GATE (per the plan): this environment is considered validated when the existing
#     test suite (proyecto1/tests/, proyecto2/tests/, proyecto3/tests/ — 1,749 tests as of
#     2026-09-18) passes against it unmodified, via .github/workflows/pg-tests.yml or an
#     equivalent full-suite CI job once that's built. Do not trust this file's correctness beyond
#     "reviewed by inspection" until that gate runs green once.

name: des
channels:
  # NOTE: `defaults` is carried over unchanged from environment.yml for channel-consistency with
  # the Windows env this was derived from. Anaconda's `defaults` channel has commercial-use
  # licensing terms for organizations above a certain size — if that applies here, switch this
  # (and environment.yml's) channel to `conda-forge`, a licensing decision, not a technical one,
  # left for whoever provisions the box to make explicitly rather than changed silently here.
  - defaults
