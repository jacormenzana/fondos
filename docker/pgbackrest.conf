# docker/pgbackrest.conf — TEMPLATE, not a working backup configuration.
# =============================================================================
# Found missing 2026-09-21 (migration addendum, Stage 7 dry-run validation): docker-compose.yml's
# pgbackrest sidecar bind-mounts this file (./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro)
# but it never existed in the repo — a bind mount to a nonexistent source makes Docker create an
# empty DIRECTORY at that path instead, which then fails to mount into a file destination. This
# closes that specific "file doesn't exist" blocker; it does NOT make backups actually work — the
# repo1-* values below are placeholders, not real credentials (plan §P1 "Backup & recovery" /
# "Credential handling" is explicit that the real bucket-scoped key belongs in a host-side secret
# file, /etc/fondos/secrets/pgbackrest_b2.conf, mode 0600, OUTSIDE this repo — never here).
#
# Before this sidecar is trusted for anything:
#   1. Replace repo1-s3-bucket / repo1-s3-endpoint / repo1-s3-region below with the real
#      Backblaze B2 (or S3-compatible) bucket details.
#   2. Provision the real, bucket-scoped (never account-master) key as the host secret file the
#      compose file already references (pgbackrest_b2_conf) — this .conf file's [global] section
#      does not itself carry the access key; pgBackRest reads S3 credentials from a separate
#      credentials mechanism (env vars or repo1-s3-key/-key-secret, normally injected via the
#      mounted secret, not committed here).
#   3. Run the restore drill (plan §P1) — an untested backup is a hypothesis, not a recovery path.
# =============================================================================

[global]
repo1-type=s3
repo1-s3-bucket=REPLACE_WITH_REAL_BUCKET_NAME
repo1-s3-endpoint=s3.us-west-000.backblazeb2.com
repo1-s3-region=us-west-000
repo1-retention-full=4
repo1-retention-full-type=count
compress-type=zst
start-fast=y

[fondos]
pg1-path=/var/lib/postgresql/data
