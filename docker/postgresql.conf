# =============================================================================
# postgresql.conf — `fondos` operational database, PostgreSQL 17
# =============================================================================
# Part of the SQLite → PostgreSQL migration (plan: role-you-are-keen-ladybug.md, §P1).
# Target: Dell OptiPlex 3070, Ubuntu 24.04 LTS, Docker, single NVMe, single-user workload
# (P1/P2/P3 pipeline writes + Superset dashboard reads, never truly concurrent at volume).
#
# DEFAULT PROFILE BELOW IS SIZED FOR 16 GB RAM. Where a value differs on a 32 GB box, the
# alternate is given in a comment on the same line — swap in the 32GB value if this box has more
# RAM. Do not blindly double every value: shared_buffers stays a FRACTION of RAM (25%), not a
# fixed increment, and doubling it wastes RAM on double-buffering against the OS page cache.
# =============================================================================

# -----------------------------------------------------------------------------
# Memory
# -----------------------------------------------------------------------------
shared_buffers = 4GB                       # 32GB box: 8GB — 25% of RAM either way
effective_cache_size = 11GB                # 32GB box: 24GB — planner hint; deliberately generous,
                                            # the ~14GB DB genuinely is mostly OS-cached, and this
                                            # is what makes the planner prefer index scans
work_mem = 64MB                            # 32GB box: 128MB — PER SORT/HASH NODE, not per
                                            # connection; a 6-way parallel hash join can use 6x this
maintenance_work_mem = 1GB                 # 32GB box: 2GB — bump to 4GB TEMPORARILY during the
                                            # one-time seed load (§P3), then revert
huge_pages = try                           # NOT `on` — see plan §P1: forcing `on` requires host
                                            # vm.nr_hugepages + IPC_LOCK + a Docker shm_size bump,
                                            # three things that break silently on kernel upgrades.
                                            # `try` degrades to normal pages without erroring;
                                            # monitored monthly via control.check_hugepages() +
                                            # the host-side /proc/meminfo leg (§P2 huge_pages drift)

# -----------------------------------------------------------------------------
# Planner — NVMe, not spinning disk
# -----------------------------------------------------------------------------
random_page_cost = 1.1                     # the default 4.0 is a 2005 spinning-disk number and is
                                            # the most common cause of PG choosing seq scans over
                                            # index scans on modern storage
seq_page_cost = 1.0
effective_io_concurrency = 200             # NVMe queue depth
maintenance_io_concurrency = 200
default_statistics_target = 200
jit = off                                  # DELIBERATE, both RAM sizes: JIT compilation costs
                                            # 50-200ms and jit_above_cost misfires on the mid-size
                                            # analytical queries this workload is full of — net
                                            # negative on a 6-core desktop running sub-second queries

# -----------------------------------------------------------------------------
# WAL / checkpoints — PRODUCTION posture. Distinct from, and reverted to after, the seed-load
# window's temporary `wal_level = minimal` (§P3 "WAL strategy") — do not confuse the two.
# -----------------------------------------------------------------------------
wal_level = replica                        # archive_mode=on requires at least `replica`
archive_mode = on
archive_command = 'true'                   # REPLACE with the actual pgBackRest archive-push
                                            # command once §P1 "Backup & recovery" credentials are
                                            # provisioned — `true` is a safe no-op placeholder that
                                            # will NOT silently discard WAL (PG blocks WAL recycling
                                            # until archive_command succeeds), so this must be
                                            # wired before the box is trusted unattended
max_wal_size = 4GB                         # 32GB box: 8GB — fewer checkpoints during P2 bulk writes
min_wal_size = 1GB                         # 32GB box: 2GB
checkpoint_completion_target = 0.9         # spread checkpoint IO; avoids stalls on a single device
checkpoint_timeout = 15min
wal_compression = zstd                     # cheap on 6 cores, meaningfully less WAL

# -----------------------------------------------------------------------------
# Parallelism — i5-9500, 6c/6t
# -----------------------------------------------------------------------------
max_worker_processes = 6                   # = core count
max_parallel_workers = 4                   # leave 2 cores for the P1/P2/P3 Python process itself
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2       # bump to a higher value only TEMPORARILY during the
                                            # seed load's index builds (§P3)

# -----------------------------------------------------------------------------
# Connections — deliberately low ceiling (§P1 "Concurrency & resource isolation"). This box has
# no connection-pooler tier; a low max_connections makes runaway connection growth fail fast and
# visibly instead of degrading gradually into swapping.
# -----------------------------------------------------------------------------
max_connections = 40
# Per-role CONNECTION LIMIT and statement_timeout are set in db/pg/00_roles_schemas.sql
# (fondos_app: 4, superset_ro: 8 + 30s statement_timeout) — this ceiling is the backstop, not the
# primary control.

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
default_toast_compression = lz4            # raw_kiid_text (~58M chars) + dla2_table_text
                                            # (~8.9M chars) are 100% TOASTed; lz4 decompresses ~4x
                                            # faster than pglz at a marginal ratio cost (PG14+)

# -----------------------------------------------------------------------------
# Observability — makes pg_stat_statements / auto_explain / EXPLAIN(ANALYZE,BUFFERS) actually
# diagnostic, and is how the automated maintenance apparatus (control.run_monthly_maintenance,
# db/pg/35_control.sql) gets trended rather than assumed.
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
auto_explain.log_min_duration = 2000
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_nested_statements = on
track_io_timing = on
log_min_duration_statement = 500ms
log_checkpoints = on
log_autovacuum_min_duration = 1000ms

# -----------------------------------------------------------------------------
# Autovacuum — global defaults. Per-table insert-triggered overrides for the two big tables
# (gold.fmts_p_*, bronze.fund_nav_daily) live in db/pg/30_gold.sql / 10_bronze.sql — NOT here,
# because settings on a partitioned parent are not inherited by partitions (§P2 Autovacuum).
# -----------------------------------------------------------------------------
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

# -----------------------------------------------------------------------------
# Locale / timezone
# -----------------------------------------------------------------------------
timezone = 'Europe/Madrid'
datestyle = 'iso, mdy'
lc_messages = 'en_US.UTF-8'
