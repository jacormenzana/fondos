[pytest]
# ".." (repo root) makes `shared.config` importable directly, without every
# calculations module needing its own hand-rolled sys.path.insert bootstrap.
# Root cause fix 2026-09-14: two existing bootstraps (regime_returns.py,
# macro_sensitivity.py) used an off-by-one parents[] index that pointed one
# directory ABOVE the repo root — silently masked because some other test
# module always happened to import first in the full suite and pollute
# sys.path process-wide; broken when those test files run in isolation.
pythonpath = . ..
