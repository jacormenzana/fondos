# Rename map: SQLite (live schema, introspected 2026-09-17) → PostgreSQL lower_snake.
#
# Generated by direct introspection of db/fondos.sqlite (PRAGMA table_info + sqlite_master.sql),
# NOT from db/schema_fondos.sql, which is known to be stale (v25-labelled, missing 3 live tables
# and 1 live view, disagreeing on fund_metric_timeseries' FK/load_ts). See the migration plan,
# §P2 "Source of truth".
#
# This file is both (a) the input the DDL generator was built from and (b) the checklist for the
# Phase 5 application-layer `?`/string-built-SQL sweep — every source column name below must be
# found and replaced at every call site touching that table.
#
# Two renames are structural, not cosmetic:
#   - `window` → `window_label`   (PostgreSQL reserved word; affects fund_metric_timeseries
#                                   AND fund_metric_alerts, both of which have a `window` column)
#   - `role`   → `position_role`  (portfolio_weights; avoids the SQL:2003 reserved word `role`,
#                                   which PostgreSQL accepts unquoted today but is reserved by
#                                   the standard and has bitten other engines on upgrade)
#
# Table names below are already lower_snake in SQLite (verified) — none are renamed. Schema
# (bronze/silver/gold/control) placement is recorded per the Medallion mapping in AGENTS.md /
# SCHEMA_REFERENCE.md and confirmed in the plan's §P2 "Namespaces" section.

schema_layer:
  bronze:
    - fund_nav_daily
    - fund_nav_monthly
    - series_macro
    - series_benchmark
    - series_inflation
    - fund_kiid_metadata
    - db_document_catalogue
  silver:
    - fund_master
    - fund_benchmarks
    - fund_cost_schedule
    - fund_cost_corrections
    - fund_families
    - fund_data_quality_issues
    - kiid_lifecycle
  gold:
    - fund_metrics
    - fund_metric_timeseries
    - fund_metric_alerts
    - fund_scores
    - portfolio_scenarios
    - portfolio_weights
    - rotation_costs
    - regime_history   # NEW TABLE, no SQLite source — see below
  control:
    - fund_metric_state
    - p2_pipeline_log
    - ingestion_log
    - nav_sources
    - audit_statistic
    - audit_finding

excluded_dead_tables:
  # Snapshot/scratch tables — not migrated (§P2 "Source of truth")
  - _piloto_snapshot
  - fund_master_20260430
  - fund_kiid_metadata_20260430
  - fund_cost_schedule_snapshot_20260824
  - fund_cost_schedule_snapshot_20260824b

new_tables_no_sqlite_source:
  # The inverse of excluded_dead_tables: tables that exist ONLY in the PG target, created by a
  # cross-session coordination (P3 Phase 3, 2026-09-19), not migrated from any SQLite table.
  # scripts/mig/pg_seed.py does NOT copy these — they're populated by application code
  # (proyecto3/src/regime_classifier.py) after cutover, not by the one-shot seed.
  regime_history:
    status: >
      NEW — P3 Phase 3b. No SQLite equivalent exists or ever will; this table's whole reason for
      existing is that SQLite never persisted classify_historical()'s output (rebuilt in memory on
      every call). Excluded from scripts/mig/pg_reconcile.py's checks entirely — there is nothing
      on the SQLite side to reconcile it against.

views:
  v_cost_arbitration_overall:
    status: >
      Carried forward verbatim (CASE logic unchanged), querying bronze.fund_kiid_metadata but
      placed in the SILVER schema, not bronze — superset_ro has no USAGE on bronze at all (it
      holds raw KIID text), and a grant on a lone bronze view with no schema USAGE would be inert.
      Placing the view itself in silver keeps that boundary absolute. See 40_matviews.sql.
  v_p2_patron_x_naturaleza:
    status: >
      LIVE-DB-ONLY — defined nowhere in the repo (not in schema_fondos.sql, not in any migration
      script). Captured by direct introspection during this migration; would have been silently
      lost by any schema-file-driven port. See plan §P4 "Views ported".

