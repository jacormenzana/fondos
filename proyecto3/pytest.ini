[pytest]
# "." (proyecto3) + ".." (repo root) on sys.path. proyecto3/src modules import
# each other via the full `proyecto3.src.X` dotted path (see regime_classifier.py's
# own sys.path.insert(parents[2]) bootstrap), unlike proyecto2's shorter `src.X`
# convention -- tests mirror whichever style the module under test uses.
# Pattern mirrors proyecto2/pytest.ini (2026-09-14 root-cause fix for off-by-one
# parents[] bootstraps); kept for cross-project consistency.
pythonpath = . ..
